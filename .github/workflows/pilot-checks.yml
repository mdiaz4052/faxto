name: Pilot checks (no deployment)
on:
  push:
    branches: ['pilot/release-led-2026-09-29']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pilot-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate pilot when present
        run: |
          if [ -f tools/build_site.py ]; then python3 tools/build_site.py --check; fi
          if [ -d tests ]; then python3 -m unittest discover -s tests -v; fi
      - name: Package the exact public source (no Git configuration)
        run: git archive --format=zip --output="$RUNNER_TEMP/faxto-source.zip" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: faxto-source-${{ github.sha }}
          path: ${{ runner.temp }}/faxto-source.zip
          retention-days: 7
